# Single-node Kafka (KRaft, no ZooKeeper) for KhataVaani notifications.
#   docker compose up -d kafka        -> broker on localhost:9094 (9094, because 9092 is often taken by another
#                                        local Kafka)
#   set KAFKA_BOOTSTRAP=localhost:9094 in .env, restart the server
#   cd server && ../.venv/Scripts/python -m app.notify_worker   (consumes khata.notifications)
services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9094:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
