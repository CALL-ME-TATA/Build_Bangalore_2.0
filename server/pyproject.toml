[project]
name = "khatavaani-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "websockets",
  "httpx",
  "rapidfuzz",
  "cryptography",
  "python-dotenv",
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "pytest-asyncio", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nlu*", "app*", "mock_gnani*"]

[tool.setuptools.package-data]
nlu = ["vocab/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
